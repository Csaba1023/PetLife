<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petavira</title>
<meta name="description" content="Kisállat életútkövető és tanácsadó: oltások, teendők, táplálkozás és nevelés az állatod korához igazítva.">
<meta name="theme-color" content="#F2F6F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petavira">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  /* Fenyő, Zúzmara, Papír, Tinta, Kavics, Sáfrány; --acc = a kiválasztott állat fajcsoportjának akcentszíne */
  --bg:#F2F6F1;--card:#FFFFFF;--ink:#14201C;--muted:#5B6B64;--line:#DDE5DE;--soft:#E6ECE6;
  --brand:#0F3D33;--brand-ink:#FFFFFF;--ball:#F2B33D;--ball-ink:#14201C;
  --acc:#1F5A4C;--hero:var(--acc);--hero-ink:#FFFFFF;--hero-soft:rgba(255,255,255,.28);
  --alert:#B93661;--alert-ink:#FFFFFF;--alert-bg:#FBE8EE;--info:#2B6CA8;--info-bg:#E5EFF9;--tip:#6B4A00;--tip-bg:#FBEFD0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1714;--card:#17231F;--ink:#E8EFEA;--muted:#9DB0A7;--line:#2A3A34;--soft:#1E2C27;
  --brand:#7FD1B5;--brand-ink:#0E1714;
  --alert:#F28BAB;--alert-ink:#2A0F19;--alert-bg:#3A1C28;--info:#8DBDEB;--info-bg:#1A2E42;--tip:#F2B33D;--tip-bg:#2A2412;
}}
:root[data-theme="dark"]{
  --bg:#0E1714;--card:#17231F;--ink:#E8EFEA;--muted:#9DB0A7;--line:#2A3A34;--soft:#1E2C27;
  --brand:#7FD1B5;--brand-ink:#0E1714;
  --alert:#F28BAB;--alert-ink:#2A0F19;--alert-bg:#3A1C28;--info:#8DBDEB;--info-bg:#1A2E42;--tip:#F2B33D;--tip-bg:#2A2412;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;margin:0;letter-spacing:-.005em}
h1{font-size:27px}h2{font-size:20px;margin:26px 0 10px}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font-size:25px;color:var(--brand)}
.topr{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:1;min-width:0}
.gear{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--brand);display:grid;place-items:center;padding:0}
.gear[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ic{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.pill{display:flex;align-items:center;gap:8px;min-height:44px;min-width:0;max-width:calc(100% - 52px);padding:4px 14px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.pill b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:6px 16px 88px}
#view.chatmode{overflow:hidden;display:flex;flex-direction:column;padding:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin:0 auto;display:flex;height:64px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab i{display:grid;place-items:center;width:48px;height:30px;border-radius:15px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--brand);font-weight:700}
.tab[aria-current=page] svg{stroke-width:2.1}
/* kiemelt középső gomb: Tanácsadó */
.tab.mid{color:var(--ink);justify-content:flex-end;padding-bottom:6px}
.tab.mid i{width:54px;height:54px;border-radius:50%;margin-top:-26px;background:var(--ball);color:var(--ball-ink);box-shadow:0 0 0 5px var(--card)}
.tab.mid svg{width:26px;height:26px}
.tab.mid[aria-current=page] i{background:var(--brand);color:var(--brand-ink)}
.ava{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.ava svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ava.big{width:72px;height:72px;border:3px solid var(--hero-soft)}
.hero span.ava{background:rgba(255,255,255,.18);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--alert);color:var(--alert-ink)}
.btn.small{width:auto;min-height:44px;padding:0 16px;border-radius:12px;flex:none}
.btn.text{width:auto;min-height:44px;padding:0 8px;background:none;color:var(--brand);font-weight:600}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.sub,.hint{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
/* hős kártya az életút-sávval */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px}
.hero .who{display:flex;gap:14px;align-items:center}
.hero h1{font-size:28px}
.hero .meta{font-size:15px}
.hero .edit{margin-left:auto;align-self:flex-start;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--hero-soft);background:none;color:inherit;display:grid;place-items:center;padding:0}
.trail{margin:22px 0 8px}
.trail-bar{position:relative;display:flex;gap:6px;height:10px}
.seg{flex:1;border-radius:5px;background:var(--hero-soft)}
.seg.past{background:rgba(255,255,255,.62)}
.seg.cur{background:linear-gradient(to right,#fff var(--f),var(--hero-soft) var(--f))}
.ballmark{position:absolute;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
.ballmark svg{display:block;width:100%;height:100%}
.trail-lab{display:flex;gap:6px;margin-top:10px;font-size:13px}
.trail-lab span{flex:1}
.trail-lab .on{font-weight:700}
.hero .next{font-size:14px;margin:12px 0 0}
.banner{display:flex;gap:12px;align-items:center;background:var(--ball);color:var(--ball-ink);border-radius:18px;padding:14px 16px;margin-bottom:14px;font-weight:600}
.banner .btn{background:var(--ball-ink);color:var(--ball)}
/* teendők */
.tasks{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tasks li{display:flex;gap:12px;align-items:center;padding:14px 16px}
.tasks li+li{border-top:1px solid var(--line)}
.tasks li>div,.tasks li>.plink{flex:1;min-width:0}
.plink{display:block;color:inherit;text-decoration:none}.plink b::after{content:"\00a0↗";font-weight:400;color:var(--muted)}
.pits{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pit{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:inherit;font-size:14px;font-weight:600;text-decoration:none}
.pit::after{content:"\00a0↗";font-weight:400;color:var(--muted)}
.pit.off{border-style:dashed;background:none;color:var(--muted);font-weight:500}.pit.off::after{content:""}
.blink{color:inherit;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.tasks b{display:block}
.when{display:block;font-size:14px;color:var(--muted)}
.late .when{color:var(--alert);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:6px 6px 0 0;background:var(--tip-bg);color:var(--tip)}
.tag.must{background:var(--alert-bg);color:var(--alert)}
.tips{list-style:none;margin:0;padding:0}
.tips li{position:relative;padding:2px 0 2px 26px;margin-bottom:12px}
.tips li::before{content:"";position:absolute;left:4px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--ball)}
.disc{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.note{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0}
/* életút */
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 30px;position:relative}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;border-left:2px dashed var(--muted);opacity:.45}
.tl>li{position:relative;margin-bottom:14px}
.tl>li.it::before{content:"";position:absolute;left:-27px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2.5px solid var(--muted)}
.tl>li.done::before{background:var(--brand);border-color:var(--brand)}
.tl>li.now::before{border-color:var(--brand)}
.tl>li.late::before{border-color:var(--alert)}
.tl>li.own::before{background:var(--ink);border-color:var(--ink)}
.tl>li.wc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:21px;margin-bottom:10px;font-size:14px;font-weight:600}
.tl>li.wc small{flex:none;font-weight:500;font-size:13px;color:var(--muted)}
.tl>li.wc::before{top:0}
.tl .card{padding:14px}
.tl .card b{display:block}
.tl .card p{font-size:14px;color:var(--muted);margin:6px 0 0}
.tl .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
.tl .ok{color:var(--brand);font-weight:700;font-size:14px}
.tl>li.stage{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;padding:8px 0 2px}
.tl>li.stage small{display:block;font:500 13px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted)}
.tl>li.stage::before{content:"";position:absolute;left:-25px;top:15px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.tl>li.today{display:flex;align-items:center;gap:10px;font-weight:700}
.tl>li.today .ballmark{position:absolute;left:-19px;top:50%}
.tl>li.today::after{content:"";flex:1;border-top:2px solid var(--ink);opacity:.25}
/* chat */
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px 10px}
#msgs{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.a .bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px}
.msg.e{align-self:center;background:var(--alert-bg);color:var(--alert);border-radius:12px;padding:10px 14px;font-size:14px;max-width:100%}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sugs button{text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;resize:none;min-height:48px;max-height:120px;padding:11px 14px;line-height:1.4}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:700}
.note.warn{background:var(--alert-bg);color:var(--alert)}
.seg2{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.seg2::-webkit-scrollbar{display:none}
.seg2 button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.seg2 button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.short{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.num{font:600 30px/1.1 Fraunces,Georgia,serif}
.tv{display:flex;flex-wrap:wrap;gap:10px}.tv>div{flex:1 1 130px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}.tv .num{font-size:26px;margin:2px 0}
.tag.off{background:none;border:1px solid var(--alert);color:var(--alert);padding:0 6px}.tag.ok{background:var(--soft);color:var(--brand)}.tbad{color:var(--alert);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:6px}.leg i{display:inline-block;width:22px;border-top:2.5px solid var(--brand);vertical-align:middle;margin-right:6px}.leg i.b{border-top:2.5px dashed var(--muted)}
.chart{display:block;width:100%;height:auto;margin-top:12px}
.bad{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0}
.bad li{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.plan div{text-align:center;font-size:13px;color:var(--muted)}
.plan i{display:block;height:56px;border-radius:8px;margin-bottom:6px;background:linear-gradient(to top,var(--brand) var(--h),var(--soft) var(--h))}
.plan b{display:block;color:var(--ink);font-size:15px}
a.btn{text-decoration:none}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.back{margin-left:-8px}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 18px;border-radius:26px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px -6px rgba(8,22,18,.55)}
.sheet.chatsheet{display:flex;flex-direction:column;height:88%;padding:14px 0 0;overflow:hidden}
.chatsheet .composer{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.aitext{white-space:pre-wrap;overflow-wrap:anywhere}
.tag.prem{background:var(--ball);color:var(--ball-ink)}
.srcs{margin:0 0 12px;padding-left:18px;font-size:14px}.srcs li{margin:6px 0}.srcs a{color:var(--info);word-break:break-word}
.guide{margin-bottom:8px}.guide p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:8px}
.acc summary{min-height:52px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
.acc[open] summary::after{content:"–"}
.acc>p,.acc>.aitext{margin:0 0 10px}
.steps2{margin:0 0 10px;padding-left:22px}.steps2 li{margin-bottom:6px}
.acc .ok{color:var(--brand);font-weight:800}
/* űrlapok, lapok */
.f{display:block;margin:14px 0}
.f>span{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
textarea{padding:12px 14px}
.err{color:var(--alert);font-weight:600;font-size:14px;margin:8px 0}
.capbox{margin:6px 0}.capbox:empty{display:none}
.ck{display:flex;gap:10px;align-items:flex-start;margin:14px 0 6px;font-size:14px;line-height:1.45;cursor:pointer}
.ck input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--brand)}
.air summary .tag{margin:0 0 0 6px;vertical-align:1px}
.tag.av-no{background:var(--line);color:var(--muted)}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}
.priv h3{font-size:16px;margin:20px 0 6px}
.priv p,.priv li{font-size:14px;line-height:1.5}
.priv ul{padding-left:18px;margin:6px 0}
.priv a{color:var(--brand);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;min-height:0}
.chips span,.chip{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chips input:checked+span,.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{min-height:104px;padding:8px 4px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tile em{font-style:normal;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--t);color:#fff;font-size:20px}
.tile[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.steps i.on{background:var(--brand)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(8,22,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet h2{margin-top:0;font-size:22px}
.sheet .btn+.btn{margin-top:10px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%;text-align:center}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0}
.list li+li{border-top:1px solid var(--line)}
.list .grow{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:48px}
.empty{text-align:center;padding:36px 8px}
.empty .big{width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:36px}
.empty h1{margin:14px 0 8px;font-size:30px}
/* Gondozás lap */
.hub{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hub button{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);text-align:left}
.hub i{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--brand);font-size:19px;font-style:normal}
.hub b{display:block}
.hub small{display:block;font-size:14px;color:var(--muted)}

  i:['Horgászbot-játék: mozgasd úgy, mint a zsákmányt, és a végén hagyd elkapni.','Kartondoboz és fül nélküli papírzacskó búvóhelynek.','Etetőlabda vagy szimatszőnyeg a száraztáphoz.','Fekhely az ablakpárkányra, hogy nézelődhessen.'],
  p:[['Kaparja a bútort','A kaparás természetes szükséglet. Tegyél stabil kaparófát a kedvenc bútora mellé, a bútort átmenetileg takard le, és jutalmazd, ha a kaparófát használja.'],['Az alomtálca mellé piszkít','Először az állatorvos zárja ki az egészségügyi okot. Utána nézd át: elég tiszta és elég nagy-e a tálca, nyugodt helyen van-e, és van-e belőle elég (macskánként egy, plusz egy).'],['Éjszaka ébreszt','Este játssz vele egy nagyot, utána adj enni. Az éjszakai nyávogásra ne reagálj, különben megtanulja, hogy működik. Idős macskánál mutasd meg állatorvosnak.'],['Harap vagy karmol játék közben','Kézzel soha ne játssz vele. Ha rád támad, állj meg és fordulj el, majd kínálj játékot. Naponta többször vezesd le az energiáját vadászjátékkal.'],['Nem jön ki az új macskával','Az összeszoktatás lassú: előbb külön szoba és szagcsere, aztán rövid, felügyelt találkozások evés közben. Ne siettesd.']]},

 kutya:[{k:'szoba',t:'Szobatisztaság',st:['kolyok','novendek'],s:['Vidd ki ébredés, evés, ivás és játék után, valamint lefekvés előtt. Kölyöknél napközben 1–2 óránként is.','Mindig ugyanarra a helyre menjetek, és várj nyugodtan, játék nélkül.','Amint végzett, ott helyben dicsérd meg, és adj jutalomfalatot.','Bent figyeld a jeleket: szimatol, köröz, az ajtóhoz megy. Ilyenkor azonnal vidd ki.','Ha baleset történt, szó nélkül takarítsd fel szagsemlegesítő tisztítóval. Ne büntesd, mert utólag nem érti.'],tip:'Hetekig, néha hónapokig tart, és a visszaesés is természetes. Ha szobatiszta felnőtt kutya hirtelen bepiszkít, mutasd meg állatorvosnak.'},

 nyul:[{k:'alom',t:'Alomra szoktatás',st:['novendek','felnott'],s:['Figyeld meg, melyik sarokba jár, és oda tedd a tálcát.','Tegyél bele almot, a végébe szénát, mert evés közben szeret üríteni.','A máshol talált bogyókat tedd a tálcába.','Kezdetben kisebb területen tartsd, és fokozatosan bővítsd.'],tip:'Csomósodó macskaalmot ne használj. Ivartalanítás után megbízhatóbb.'},

 eger:{g:{kolyok:EG_Y,novendek:EG_Y,

  idos:[['Idős kor','Egyéves kor fölött gyakori a vesebetegség: ha sokat iszik, sokat vizel vagy fogy, vidd állatorvoshoz.'],['Csomók','Idős korban daganat alakulhat ki, gyakran a hasi szagmirigyen: a hasán lévő csomót vagy sebet mutasd meg az állatorvosnak.'],['Ellenőrzés','Idős korban évente kétszer érdemes állatorvoshoz vinni.']]},
  i:['Rágnivaló: fűz-, mogyoró-, bükk-, nyír- vagy gyümölcsfaág; borostyánt, tiszafát és magyalt ne adj, mert mérgező.','Érdes kő a terráriumban: koptatja a karmait.','A terrárium álljon távol a tévétől, a monitortól és a porszívótól: érzékeny az ultrahangra.','Takarításkor a tiszta régi alom kb. harmadát tedd vissza.','Műanyag játékot és házat ne adj: szétrágja.'],
  p:[['Görcsrohama volt','A futóegerek kb. 20–40%-ánál fordul elő görcsroham, általában 2–3 hónapos kortól; hirtelen stressz, rossz megfogás vagy új környezet válthatja ki. Ritkán halálos, és nem okoz maradandó károsodást; a források szerint gyógyszer nem kell rá. Ha bizonytalan vagy, kérdezd meg az állatorvost.'],['Megsérült a farka, lejött róla a bőr','A farkánál megfogva a bőr lecsúszhat róla; a csupasz rész elhal, és amputálni kell. Azonnal vidd állatorvoshoz, és soha ne fogd meg a farkánál.'],['Sebes, kopasz az orra','Stressz jele lehet: összeférhetetlen társ, zsúfoltság, magas páratartalom. Vidd állatorvoshoz, és tartsd száraz helyen (50% alatti páratartalom).'],['Hasmenése van, borzas a szőre','Fertőző bélbetegség (Tyzzer-betegség) jele lehet: levert, görnyedten ül, nem eszik. Különítsd el a társaitól, és azonnal vidd állatorvoshoz.'],['Nem eszik, túl hosszú a foga','A metszőfogai folyamatosan nőnek; a túlnőtt fog fájdalmat okoz, és az állat nem eszik. Vidd állatorvoshoz, és adj rágófát.'],['Verekednek','Azonnal válaszd szét őket. Az idegen felnőtt futóegerek megtámadhatják egymást; egy forrás szerint a hímek különösen.'],['Folyik az orra vagy a szeme, levert','Betegség jele: vidd állatorvoshoz.']]},
 'futoeger:kover':{g:{all:[['Megérkezés','Hagyd megszokni az új helyét. Szelíd állat: lassú, gyengéd, rendszeres kézbevétellel könnyen megszelídül.'],['Egyedül vagy párban','Gyakran jól megvan egyedül. Azonos nemű páros is működhet, de figyelmeztetés nélkül összeveszhetnek: ha verekednek, azonnal válaszd szét őket.'],['Napirend','Főleg szürkületkor és éjszaka aktív: napközben hagyd nyugodtan pihenni, este foglalkozz vele.'],['Homokfürdő','Külön homokfürdő kell neki, különben zsíros, csomós lesz a szőre.'],['Élettartam','A források eltérnek: 2–4, illetve 5–7 évet írnak. Ezért az app ennél a fajnál nem számol életszakaszt, csak az életkort követi.'],['Állatorvos','Keress kisemlősökhöz értő állatorvost. Azonnal vidd el, ha nem eszik, levert, sípolva vagy nehezen lélegzik, hirtelen fogy, és összeesik a farka, nyáladzik, vagy kopasz, sebes foltja van.']]},
  i:['Tömör futókerék; egy forrás 20 cm átmérőt ír.','Biztonságos fa a rágáshoz: a fogai folyamatosan nőnek.','Műanyag játékot ne adj; kókuszhéj, fa és karton való neki.','A farkát soha ne fogd meg: megsérülhet.'],
  p:[['Sovány, összeesett a farka','A farka zsír- és vízraktár: az összeesett farok alultápláltságot vagy betegséget jelez. Ha közben hirtelen fogy vagy levert, vidd állatorvoshoz.'],['Kövér, kidudorodik a farka','Túl sok a zsíros csemege vagy a magkeverék, és kevés a mozgás. Mérd ki az adagot, és legyen futókereke.'],['Nyáladzik, kiejti az ételt, fogy','Túlnőtt fog jele lehet. Vidd állatorvoshoz, és legyen mindig rágnivaló fája.'],['Sípolva, kattogva vagy nehezen lélegzik','Légúti fertőzés jele lehet. Vidd állatorvoshoz; a terráriumot tartsd szárazon, jól szellőzve, poros és nyirkos alom nélkül.'],['Zsíros, csomós a szőre','Homokfürdő kell neki. Ha a bőre hámlik vagy sebes, vidd állatorvoshoz.'],['Vakarózik, hullik a szőre','Atka okozhatja: állatorvosi vizsgálat és kezelés kell.']]},
 degu:{g:{kolyok:DG_Y,novendek:DG_Y,
  felnott:[['Mozgás','Sokat ás, mászik és rág. Naponta fél óra vagy több mozgás jár neki a ketrecen kívül, felügyelet mellett.'],['Homokfürdő','Hetente két-három alkalommal kínálj homokfürdőt 20–30 percre, utána vedd ki: ha állandóan bent van, kiszárad a bőre.'],['Hőmérséklet','A meleget rosszul tűri, 30 °C fölött könnyen hőgutát kap. Az ideális 18–21 °C.'],['Állatorvos','Keress egzotikus állatokhoz értő állatorvost, és évente vidd el ellenőrzésre: súly, fogak, szem.']],
  idos:[['Szem','A szem elhomályosodása (szürkehályog) cukorbetegség jele lehet: vidd állatorvoshoz.'],['Súly','Tartsd a súlyát: a források szerint a hím legfeljebb kb. 275 g, a nőstény kb. 250 g legyen.'],['Fogak','A foga sárgás-narancs színű: ez a természetes. Ha kifehéredik, ha nyáladzik vagy nem eszik, vidd állatorvoshoz.']]},
  i:['Rágnivaló: alma-, körte-, kőris-, bükk- vagy tölgyág.','Ásóláda földdel és homokkal.','Tömör futókerék, kb. 35 cm átmérővel.','A ketrec fémből legyen: a műanyagot és a fát átrágja.','Takarításkor a tiszta régi alom kb. harmadát tedd vissza.'],
  p:[['Sokat iszik és vizel, homályos a szeme','Cukorbetegség jele lehet. Vidd állatorvoshoz, és nézd át az étrendjét: gyümölcs és cukros csemege ne legyen benne.'],['Nyáladzik, könnyezik a szeme, nem eszik','Fogbetegség jele lehet; a fog színének változása és a duzzadt arc is erre utal. Vidd állatorvoshoz.'],['Megsérült a farka, lejött róla a bőr','Ijedtében vagy rossz fogásnál „ledobhatja” a farka bőrét. Mielőbb vidd állatorvoshoz: amputálni kellhet. A farkánál soha ne fogd meg.'],['Meleg van a lakásban','30 °C fölött könnyen hőgutát kap. Tedd hűvös helyre, ablaktól és radiátortól távol; ha rosszul van, azonnal hívd az állatorvost.'],['Rágja a saját vagy a társa szőrét','Magány vagy unalom jele lehet. Legyen társa, rágnivalója, ásási lehetősége.'],['Tüsszög, folyik a szeme vagy az orra','Légúti betegség jele lehet. Vidd állatorvoshoz.'],['Verekednek','Legyen elég étel, víz és búvóhely, több helyen. Kisebb civakodás előfordul, de ha komoly a verekedés, válaszd szét őket.']]},
 torpesun:{g:{kolyok:HH_Y,novendek:HH_Y,
  felnott:[['Napirend','Éjszaka aktív: napközben alszik, este és éjjel mozog, eszik. Naponta engedd ki felügyelet mellett, biztonságos helyen.'],['Súly','Hajlamos az elhízásra: mérd rendszeresen. Ha összegömbölyödve is látszik az arca, a füle vagy a lába, túl kövér.'],['Önbekenés','Új vagy erős szagú anyagot megnyal, habos nyálat képez, és a tüskéire keni. Ez természetes viselkedés, nem betegség.'],['Higiénia','Szalmonellát és bőrgombát hordozhat: fogás és takarítás után moss kezet.'],['Állatorvos','Évente (egyes források szerint félévente) vidd ellenőrzésre; védőoltás nem kell neki. A karmait szükség szerint az állatorvos vágja le.']],
  idos:[['Daganat','Három éves kor fölött a daganat nagyon gyakori. Fogyás, étvágytalanság, levertség, bűzös száj vagy véres váladék esetén mielőbb vidd állatorvoshoz.'],['Fogak','A fogkő és az ínygyulladás gyakori: ha nem eszik, rossz a lehelete, vagy a száját kaparja, vizsgáltasd meg.'],['Ellenőrzés','Idős korban félévente érdemes állatorvoshoz vinni.']]},
  i:['Tömör futófelületű kerék: a rácsos kerékbe beszorul a lába.','Nehéz kerámiatál: a könnyűt felborítja.','Búvóhely: doboz, cső vagy kis házikó.','A lábára tekeredő hajszál elszoríthatja a lábát: rendszeresen nézd meg.','Rosszul lát, de kiválóan hall és szagol.'],
  p:[['Hideg, mozdulatlan, alig reagál','18 °C alatt tetszhalott állapotba (torporba) kerülhet, ami veszélyes: a több órás lehűléstől súlyosan megbetegedhet. Tedd melegebb helyre, és hívd az állatorvost. Téli álmot nem kell aludnia.'],['Meleg van a lakásban','29 °C fölött hőgutát kaphat. Tartsd 24–29 °C között, közvetlen naptól távol.'],['Hullik a tüskéje, hámlik a bőre','Tüskeatka vagy bőrgomba okozhatja: állatorvosi kezelés kell. Néhány tüske cserélődése természetes.'],['Imbolyog, oldalra dől, nem tud összegömbölyödni','Az „imbolygó sün szindróma” nevű idegrendszeri betegség jele lehet. Vidd állatorvoshoz.'],['Nem eszik, a száját kaparja','Fogbetegség, szájüregi daganat vagy a szájpadlásába szorult kemény falat okozhatja. Vidd állatorvoshoz.'],['Túl kövér','Mérd ki az adagot, és legyen futókereke. A fogyókúrát az állatorvossal egyeztesd.'],['Duzzadt, sebes a lába','Rátekeredett hajszál, rácsos kerék vagy rácsos aljzat okozhatja. Mielőbb vidd állatorvoshoz.'],['Sérült, könnyezik a szeme','A szemsérülés és a szaruhártya-fekély gyakori. Vidd állatorvoshoz.']]},
 cukormokus:{g:{kolyok:SG_Y,novendek:SG_Y,
  felnott:[['Foglalkozás','Naponta 1–2 óra (egy forrás szerint legalább 2 óra) közös idő kell neki. A kevés figyelmet kapó, magányos állat depressziós lehet, és viselkedési zavarai alakulhatnak ki.'],['Ketrecen kívül','Soha ne hagyd felügyelet nélkül a ketrecen kívül: könnyen megsérül, a legkisebb résen is átbújik, és mindent megrág, lenyel.'],['Súly','Mérd rendszeresen: a nőstény kb. 80–130 g, a hím kb. 100–160 g; egy forrás az egészséges súlyt 80–110, illetve 90–120 g-ra teszi. A túl sok cukor és szénhidrát elhízáshoz vezet.'],['Állatorvos','Évente vidd ellenőrzésre, bélsárvizsgálattal; védőoltás nem kell neki.']],
  idos:[['Idős kor','5–7 éves korától idősnek számít, de jó tartásban 10–14 évig is él.'],['Fogak','Figyeld a fogait és az arcát: a duzzanat az arcán vagy a szeme alatt fogtályog jele lehet, ami életveszélyes.'],['Ellenőrzés','Évente vidd állatorvoshoz, és mérd rendszeresen a súlyát.']]},
  i:['Fészekdoboz vagy alvózsák a nappali alváshoz.','Mászóágak: almafa vagy kezeletlen citrusfa; mandula-, kajszi-, cseresznye- és őszibarackfát, fekete diót ne adj.','Tömör futókerék, hinták, polcok.','Pamut fészekanyagot ne adj: a szálak az ujjára tekeredhetnek.','Könnyen szétrágható játékot ne adj: lenyeli a darabjait.'],
  p:[['Remeg a lába vagy a teste, sovány','Kalciumhiány jele lehet, ami a helytelen étrend következménye. Azonnal vidd állatorvoshoz.'],['Túl kövér','A normálisnál 10%-kal nagyobb testsúly túlsúlyt, 20%-kal nagyobb elhízást jelent: zsírmájhoz és szívbetegséghez vezet. Állatorvosi vizsgálat és étrendváltás kell.'],['Duzzadt az arca vagy a szeme alja','Fogtályog jele lehet; a cukros étrend és a rács rágása okozhatja. Azonnal vidd állatorvoshoz: életveszélyes lehet.'],['Hasmenése van','Fertőzés vagy élősködő okozhatja; kezeletlenül halálos lehet. Vidd állatorvoshoz, és utána mindig moss kezet.'],['Tépi a szőrét, harapja magát','Stressz, magány vagy az ivaros hímeknél jellemző öncsonkítás jele lehet. Vidd állatorvoshoz; legyen társa, és kapjon elég figyelmet.'],['Harap, hangoskodik','Idegen kézben, erőszakos megfogásnál vagy nappal megzavarva haraphat, hangoskodhat. Este, nyugodtan, fokozatosan foglalkozz vele.']]}});
Object.assign(HOME,{
 eger:[['Ketrec','Két egérnek legalább 80 × 50 cm alapterületű, 50 cm magas ketrec kell (más forrás 2–3 egérnek legalább 45 × 45 × 25 cm-t ír): minél nagyobb, annál jobb. A legjobb a rácsos ketrec műanyag tálcával, több szinttel; a rácsok legfeljebb 6 mm-re legyenek egymástól. Mély akváriumot (rossz a szellőzése) és fa ketrecet (beissza a vizeletet) ne használj.'],['Hely és hőmérséklet','18–22 °C az ideális (a források 18–26 °C-ot tartanak elfogadhatónak). Huzattól, közvetlen naptól és fűtőtesttől távol tartsd.'],['Alom és fészek','Pormentes, papír- vagy cellulózalapú almot használj, mély rétegben. Faforgácsot, fűrészport és illatosított almot ne: légúti bajt okozhat. Fészeknek papírt vagy szénát adj.'],['Kerék és berendezés','Belül sima, rés nélküli futókerék, búvóhelyek, csövek, létrák, mászóágak kellenek.'],['Itató','Fémcsöves itató, naponta ellenőrizve és frissen töltve.'],['Takarítás','Naponta távolítsd el az ürüléket és a nedves almot; a teljes takarítás hetente, legfeljebb kéthetente esedékes. A tiszta régi alom kb. harmadát tedd vissza: a túl gyakori takarítás megterheli.']],
 patkany:[['Ketrec','2–5 patkánynak legalább 90 × 60 × 120 cm-es (hossz × mélység × magasság), többszintes rácsos ketrec kell, tömör aljjal: a rácsos alj megsérti a lábát. Az üvegterrárium rosszul szellőzik, a hörcsögketrec kicsi, a fa ketrec beissza a vizeletet.'],['Hely és hőmérséklet','19–23 °C az ideális. Huzattól, közvetlen naptól és párás helyiségtől távol tartsd; nappal ne legyen túl világos, éjjel legyen sötét.'],['Alom és fészek','Vastag réteg pormentes, papír- vagy cellulózalapú alom kell. Fűrészport, poros faforgácsot, cédrust, fenyőt, illatosított almot és vattát ne használj. Fészeknek papírt vagy szénát adj.'],['Búvóhely és mászás','Eggyel több búvóhely, mint ahány patkány; függőágy, kötél, létra, cső. Futókerék csak nagy, legalább 30–35 cm átmérőjű és belül sima legyen.'],['Itató és tál','Több itató, naponta kétszer ellenőrizve, és nehéz kerámiatál: a fémtál a patkánynak zavaró, magas hangot ad.'],['Takarítás','A piszkos almot néhány naponta szedd ki, az almot hetente legalább kétszer cseréld, és hetente egyszer mosd ki a ketrecet. A piszkos ketrec légúti betegséghez vezethet.']],
 futoeger:[['Terrárium','Üvegfalú terrárium kell biztos hálótetővel és tömör aljjal, nem rácsos ketrec. 2–4 futóegérnek legalább 100 × 40 cm alapterület és 40 cm magasság kell; ideálisan kb. 50 cm magas. A hörcsögketrec nem alkalmas.'],['Alom','Az ásáshoz 20–30 cm mély alom kell: durva faforgács szénával keverve, vagy pormentes alom. Fűrészport ne használj. Fészeknek kartont, papírt, szénát adj; vattát és bolyhos fészekanyagot ne.'],['Hely és hőmérséklet','A források 18–22, illetve 20–24 °C-ot írnak. Száraz (kb. 50% vagy az alatti páratartalmú), huzatmentes helyre tedd, közvetlen naptól és radiátortól távol.'],['Kerék és berendezés','Tengely nélküli, nagy átmérőjű, tömör futófelületű kerék: a léces kerékbe beakadhat a lába vagy a farka. Fa alagút, kartoncső, rágófa, érdes kő.'],['Homokfürdő','Sekély tál tiszta, finom fürdőhomokkal.'],['Itató','Fémcsöves itató a terráriumon belül rögzítve; naponta ellenőrizd, mert a műanyagot megrágja.'],['Takarítás','Az ürüléket és a maradékot néhány naponta szedd ki; a nagytakarítás 2–3 hetente (egy forrás szerint 3–6 hetente) esedékes. A tiszta régi alom egy részét tedd vissza.']],
 'futoeger:kover':[['Terrárium','Biztonságosan zárható üvegterrárium vagy nagy rácsos ketrec kell, tömör aljjal; egy forrás legalább kb. 120 × 30 cm-es alapterületű üvegterráriumot ír.'],['Aljzat','Száraz homok vagy homok és föld keveréke kell, legalább 15–20 cm mélyen, hogy áshasson.'],['Hely és hőmérséklet','A források kb. 18–22, illetve 20–25 °C-ot írnak. Száraz (35–50% páratartalmú), jól szellőző helyre tedd, közvetlen naptól távol: a nyirkot rosszul tűri.'],['Kerék és búvóhely','Tömör futókerék (egy forrás 20 cm átmérőt ír), búvóhelyek, rágnivaló fa.'],['Homokfürdő','Külön tál tiszta fürdőhomokkal.'],['Tisztaság','Az aljzatot tartsd szárazon és tisztán, a homokfürdőt rendszeresen cseréld.']],
 degu:[['Ketrec','2–5 degunak legalább 90 × 60 × 120 cm-es, sokszintes fémketrec kell; a műanyagot átrágja. Az alja tömör legyen, ásható alommal.'],['Hely és hőmérséklet','18–21 °C az ideális; 30 °C fölött könnyen hőgutát kap. Ablaktól, közvetlen naptól és radiátortól távol tartsd.'],['Alom','Mély réteg széna, papírcsík és pormentes, nedvszívó alom.'],['Kerék és berendezés','Tömör futókerék kb. 35 cm átmérővel, hogy egyenes háttal futhasson; agyagcső alagútnak, ágak, polcok, fa búvóhely.'],['Homokfürdő','Sekély tál csincsilla- vagy hörcsöghomokkal, hetente két-három alkalommal, 20–30 percre.'],['Takarítás','A piszkos almot és a maradékot néhány naponta (lehetőleg naponta) szedd ki; a nagytakarítás kéthetente–havonta esedékes.']],

const fishOf=p=>stock(p)&&p.breed!=='mix'&&FISH[p.breed]||null;

const WF={temp:['Hőmérséklet','°C','hőmérséklet',45,'pl. 25,5'],sg:['Sűrűség','','sűrűség',1.05,'pl. 1,023'],ph:['pH','','pH',14,'pl. 7,2'],nh3:['Ammónia','mg/l','ammónia',20,'pl. 0'],no2:['Nitrit','mg/l','nitrit',20,'pl. 0'],no3:['Nitrát','mg/l','nitrát',500,'pl. 10'],gh:['Összkeménység (GH)','°dH','GH',60,'pl. 8'],kh:['Karbonátkeménység (KH)','°dH','KH',40,'pl. 5']};

const aqNum=(f,v)=>(f==='sg'?v.toFixed(3):String(Math.round(v*(f==='nh3'||f==='no2'?100:10))/(f==='nh3'||f==='no2'?100:10))).replace('.',',');
const wGoal=(f,r)=>r[0]==null?(r[1]===0?'0':`legfeljebb ${aqNum(f,r[1])}`):`${aqNum(f,r[0])}–${aqNum(f,r[1])}`;
const wStat=(v,r)=>!r||v==null?'':r[0]!=null&&v<r[0]?'lo':v>r[1]?'hi':'ok';
const wcWeeks=p=>p.wcW||(p.species==='harcoshal'?1:2);
const wcNext=p=>{const last=recs(p,'wchg')[0];if(!last)return null;const d=D(last.date);d.setDate(d.getDate()+7*wcWeeks(p));return d};
const wcDue=p=>{if(grp(p)!=='hal')return null;const d=wcNext(p);return d&&d-today()<=DAY?d:null};
const fishCard=p=>{const f=fishOf(p);

  const G=wGoals(p),row=(k,v)=>v?`<li><div style="flex:1"><b>${k}</b><span class="when">${v}</span></div></li>`:'',rg=(k,u)=>G[k]?wGoal(k,G[k])+(u?' '+u:''):'';

function wcHtml(p){const l=recs(p,'wchg'),last=l[0],next=wcNext(p),late=!!(next&&next<today());

function waterHtml(p){
  const G=wGoals(p),F=wFields(p),l=recs(p,'water'),last=l[0],asc=[...l].reverse(),unit=f=>WF[f][1]?' '+WF[f][1]:'',sea=p.species==='tengeri',f2=v=>aqNum('nh3',v);

  ${asc.length>1?`<h2>Mérések alakulása</h2><div class="card" id="wCharts">${tChart(asc,[['temp',WF.temp[0]]],'°C')}${tChart(asc,[['ph','pH']],'')}${tChart(asc,[['nh3',WF.nh3[0]],['no2',WF.no2[0]]],'mg/l',f2)}${tChart(asc,[['no3',WF.no3[0]]],'mg/l')}</div>`:''}
  <h2>Célértékek</h2><ul class="list" id="wGoals">${F.filter(f=>G[f]).map(f=>`<li><div style="flex:1"><b>${WF[f][0]}</b><span class="when">${wGoal(f,G[f])}${unit(f)}</span></div></li>`).join('')}</ul>
  <p class="sub" style="margin-top:8px">Az ammónia és a nitrit célja 0: ha bármelyik mérhető, cserélj vizet, és mérj naponta, amíg el nem tűnik. A nitrát ${sea?'tengervízben 70':'édesvízben 20'} mg/l alatt legyen.${sea?' A sűrűség egy nap alatt legfeljebb 0,001-et változzon.':' A karbonátkeménységre (KH) nincs fajonkénti célérték: a legtöbb édesvízi akváriumban 4–8 °dH a jellemző, 2 °dH alatt a pH könnyen összeomlik.'}${noSp?' A hőmérséklet'+(sea?'':', a pH és a keménység')+' célértéke a tartott fajtól függ: add meg a fő halfajt a profilban, és a napló ahhoz igazodik.':''}</p>
  ${l.length?`<h2>Mérések</h2><ul class="list" id="wList">${l.slice(0,14).map(e=>`<li><div style="flex:1;min-width:0"><b>${fmtDate(D(e.date))}</b><span class="when">${row(e)}</span></div>${delBtn(e.id)}</li>`).join('')}</ul>`:''}
  ${wcHtml(p)}${srcBox(p,'care')}
  <p class="sub" style="margin-top:14px">A célértékek tájékoztató jellegűek. Ha az értékek tartósan a célon kívül vannak, vagy a halak viselkedése megváltozik, kérj tanácsot halakhoz értő állatorvostól.</p>`}

async function pull(){

    const snap=await cdoc('main').get(),R=snap.exists?snap.data():null,hasR=!!(R&&Array.isArray(R.pets));
    if(cloud.uid!==uid)return false;
    const foreign=!!S.owner&&S.owner!==uid,anon=!S.owner;
    if(foreign){const th=S.settings.theme;S=blank();S.settings.theme=th;cloud.dirty.clear()}
    if(hasR&&(anon||foreign||!S.updatedAt||(R.updatedAt||0)>(S.updatedAt||0))){
      const pets=R.pets,[cs,...ph]=await Promise.all([cdoc('chat').get(),...pets.map(p=>p.hasPhoto?cdoc('photo_'+p.id).get():null)]);
      if(cloud.uid!==uid)return false;
      pets.forEach((p,i)=>{if(ph[i]&&ph[i].exists){const v=ph[i].data().data;if(okPhoto(v))p.photo=v}delete p.hasPhoto});
      const mine=S,keep=anon||mine.pend;
      S={pets,events:R.events||[],chat:(cs.exists&&cs.data().byPet)||{},ai:(cs.exists&&cs.data().ai)||{},settings:Object.assign(blank().settings,R.settings),updatedAt:R.updatedAt||Date.now(),owner:uid,pend:false};
      cloud.dirty.clear();
      const have=new Set(S.pets.map(p=>p.id)),extra=keep?mine.pets.filter(p=>!have.has(p.id)):[];
      if(extra.length){S.pets.push(...extra);S.events.push(...mine.events.filter(e=>!have.has(e.petId)));
        extra.forEach(p=>{if(mine.chat[p.id])S.chat[p.id]=mine.chat[p.id];if(mine.ai[p.id])S.ai[p.id]=mine.ai[p.id];if(p.photo)cloud.dirty.add('photo_'+p.id)});
        S.settings.activePetId=extra[0].id;S.updatedAt=Date.now();S.pend=true;cloud.dirty.add('main').add('chat')}
    }else{
      S.owner=uid;
      if(S.updatedAt&&(S.pend||!hasR||S.updatedAt>(R.updatedAt||0))){S.pend=true;cloud.dirty.add('main').add('chat');S.pets.forEach(p=>p.photo&&cloud.dirty.add('photo_'+p.id))}
    }

  }finally{cloud.pulling=false}
}

    if(m.every){
      (done[m.key]||[]).forEach(e=>items.push({m,done:e,date:D(e.date)}));
      const anchors=[m.key,...(m.anchors||[])].flatMap(k=>done[k]||[]).map(e=>D(e.date)).sort((a,c)=>c-a);
      let due,unknown=false;

  const l=pCat==='tap'?foods(p):P[pCat]||[];
  return`${BACK}<h1>Ajánlott termékek</h1><p class="sub" style="margin-top:4px">${esc(petName(p))}, ${fmtAge(p)}${st?', '+stHU(p,st).toLowerCase():''}</p>
  <div class="seg2" role="group" aria-label="Kategória">${Object.entries(C).map(([k,n])=>`<button data-act="pCat" data-v="${k}" aria-pressed="${pCat===k}">${n}</button>`).join('')}</div>${tierChips()}<div style="height:10px"></div>
  ${l.length?prodList(p,l):`<p class="sub">${(pCat==='tap'&&!PROD[p.species]&&PEMPTY[kitOf(p)])||(PNONE[p.species]||{})[pCat]||'Ebben a kategóriában nincs beépített ajánlás.'}</p>`}<p class="sub" style="margin-top:10px">${PNOTE}</p>
  ${l.length?`<h2>Személyre szabott ajánlás</h2>${aiBox(p,'prod_'+pCat,'AI-ajánlás kérése ebben a kategóriában')}`:''}`}

/* ---------- értesítések (push), 2026. október ----------

   Adatvédelem: a szöveget az app itt állítja össze a következő 14 napra, és csak az eszközön tárolja (Cache Storage);

function pushPlan(from=today()){
  const out={},sameDay=(a,b)=>a&&iso(a)===iso(b),multi=S.pets.length>1;
  const per=S.pets.map(p=>({p,items:buildItems(p),par:parDue(p),wc:wcDue(p)}));
  for(let d=1;d<=PUSH_DAYS;d++){
    const day=new Date(from.getFullYear(),from.getMonth(),from.getDate()+d-1),next=new Date(day.getFullYear(),day.getMonth(),day.getDate()+1),key=iso(day);
    const due=[],stage=[],tips=[];
    for(const{p,items,par,wc}of per){
      const n=petName(p),pre=multi?n+': ':'';
      if(pushT('due')){
        items.filter(i=>i.pending&&!i.unknown&&sameDay(i.date,day)).forEach(i=>due.push(pre+i.m.t));
        par.filter(x=>sameDay(x.date,day)).forEach(x=>due.push(pre+PAR_SHORT[x.t]));
        if(wc&&sameDay(wc,day))due.push(pre+'Részleges vízcsere');
        S.events.filter(e=>e.petId===p.id&&e.kind==='own'&&e.date===key).forEach(e=>due.push(pre+String(e.title||'').slice(0,60)));
      }
      if(pushT('stage')){const a=stageAt(p,day),b=stageAt(p,next);if(a&&b&&a!==b)stage.push(`${n} holnap ${STAGE_INTO[b]} lép. A teendők és a tippek ehhez igazodnak.`)}
      if(pushT('tip')){const T=tipsFor(p,stageAt(p,day));if(T!==TIPS_OTHER&&T.length)tips.push([n,T[Math.floor(day.getTime()/DAY)%T.length]])}
    }
    const one=S.pets.length===1?' – '+petName(S.pets[0]):'';
    if(due.length)out[key]={t:'Ma esedékes'+one,b:due.slice(0,3).join('\n')+(due.length>3?`\n…és még ${due.length-3}`:'')};
    else if(stage.length)out[key]={t:'Holnap szakaszváltás',b:stage.join('\n')};
    else if(tips.length){const[n,t]=tips[Math.floor(day.getTime()/DAY)%tips.length];out[key]={t:'Napi tipp – '+n,b:t}}
  }

/* ---------- AI tanácsadó ----------
   Rétegzett védelem (projektleírás, Biztonság):
   A réteg (itt, az appban): 500 karakteres kérdés, 10 üzenet előzmény, láthatatlan és vezérlőkarakterek szűrése, sebességkorlát
     (3 mp, óránként 20), ismétlődő kérdés tiltása, küldés közben tiltott gomb, nincs automatikus újrapróbálás, csak szöveg.
   B–D réteg (a szerveren, az advisor függvényben): ellenőrző hívás, határoló jelek, standing utasítás, kimenet-ellenőrzés,
     aláírt előzmény, keretek és 5 perces tiltás. Az app csak adatot küld: a feladatok szövege és a rendszerprompt a szerveren van.

const AI_INVIS=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F­͏؜ᅟᅠ឴឵᠋-᠏​-‏‪-‮⁠-⁯ㅤ︀-️﻿ﾠ￰-￿\u{E0000}-\u{E007F}\u{E0100}-\u{E01EF}]/gu;
const aiClean=(s,n)=>String(s??'').normalize('NFC').replace(AI_INVIS,'').replace(/\s+/g,' ').trim().slice(0,n);
/* a gazda szabad szövege (tünet, saját esemény, készítmény): csak betű, szám, szóköz és alapvető írásjel, legfeljebb 120 karakter */
const noteClean=s=>aiClean(String(s??'').normalize('NFC').replace(AI_INVIS,'').replace(/[^\p{L}\p{N}\s.,!?:;'"()\-–%/+°]/gu,''),120);
const AI_Q=500,AI_HIST=10,AI_GAP=3000,AI_HOUR=20;
let aiRate=(()=>{try{const r=JSON.parse(localStorage.getItem('petvia.ai')||'{}');return r&&typeof r==='object'?r:{}}catch(e){return{}}})();
const aiRateSave=()=>{try{localStorage.setItem('petvia.ai',JSON.stringify(aiRate))}catch(e){}};
function aiLimit(){const now=Date.now();aiRate.t=(Array.isArray(aiRate.t)?aiRate.t:[]).filter(x=>now-x<36e5&&x<=now);
  if(aiRate.until&&now<aiRate.until)return{code:'blocked',until:aiRate.until};
  if(aiRate.t.length&&now-aiRate.t[aiRate.t.length-1]<AI_GAP)return{code:'too_fast'};
  if(aiRate.t.length>=AI_HOUR)return{code:'hourly_limit'};return null}
const aiMark=()=>{aiRate.t=[...(aiRate.t||[]),Date.now()].slice(-AI_HOUR);aiRateSave()};
const AI_NEUTRAL='Most nem tudok válaszolni, próbáld újra később.';
const ERR={login:'A Tanácsadó fiókkal használható. Lépj be a Beállításokban (jobb felső gomb), a Fiók résznél.',session_expired:'Lejárt a belépésed. Lépj be újra a Beállításokban (jobb felső gomb), majd küldd el újra a kérdést.',offline:'Nincs internetkapcsolat. A Tanácsadóhoz kapcsolat kell.',
  daily_limit:'Mára elfogyott a kérdéskereted. Holnap újra kérdezhetsz.',hourly_limit:'Ebben az órában elérted a kérdéskeretet. Próbáld újra később.',too_fast:'Várj néhány másodpercet a következő kérdéssel.',
  refused:'Ebben nem tudok segíteni. Kisállattartásról kérdezz, például a táplálásáról, az egészségéről vagy a tartásáról.',blocked:'A Tanácsadó néhány percre szünetel. Próbáld újra később.',
  dup:'Ezt a kérdést az előbb már elküldted.',consent:'A Tanácsadó használatához előbb fogadd el a fenti tájékoztatót.',rate_limited:AI_NEUTRAL,setup:AI_NEUTRAL,none:AI_NEUTRAL,output:AI_NEUTRAL,def:AI_NEUTRAL};
const aiErrText=e=>{const c=e&&ERR[e.code]?e.code:'def';if(['def','setup','none','output','rate_limited'].includes(c))console.warn('[Tanácsadó]',e&&e.code,e&&e.detail||'');
  return c==='blocked'&&e.until&&isFinite(new Date(e.until))?`A Tanácsadó ${new Date(e.until).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})}-ig szünetel. Próbáld újra később.`:ERR[c]};
/* az állat adatai: csak kiválasztott értékek és szűrt mezők; a gazda szabad szövege rövidítve, külön (notes) megy, és a szerveren ellenőrzés után kerül az AI elé */
function aiPayload(p,task,x={}){
  const st=stageOf(p),items=buildItems(p),size=sizeOf(p),done=items.filter(i=>i.done).sort((a,c)=>a.done.date<c.done.date?-1:1);
  const due=dueList(p,items).map(i=>`- ${i.m.t}${i.unknown?'':' ('+iso(i.date)+')'}`),or=a=>a.length?a:['- nincs bejegyzés'];
  const w=recs(p,'w').slice(0,5).map(e=>`- ${e.date}: ${wTxt(p,e.kg)}`),pa=recs(p,'par').slice(0,4).map(e=>`- ${e.date}: ${PAR_SHORT[e.ptype]||'kezelés'}`);
  const profile=[`Mai dátum: ${iso(today())}`,'Az állat profilja:',`- Név: ${clean(p.name)||'nincs megadva'}`,`- Faj: ${clean(speciesLabel(p))} (fajcsoport: ${GROUPS[grp(p)].n.toLowerCase()})`,`- Fajta: ${clean(breedLabel(p))||'nincs megadva'}`,
    size?`- Méret: ${SIZE_HU[size]}`:null,`- Életkor: ${fmtAge(p)} (születési dátum: ${p.birth}${p.est?', becsült':''})`,`- Életszakasz: ${st?stHU(p,st):'ennél a fajnál nincs meghatározva'}`,
    `- Ivar: ${{him:'hím',nosteny:'nőstény'}[p.sex]||'nincs megadva'}`,grp(p)==='emlos'||grp(p)==='egyeb'?`- Ivartalanított: ${p.neutered||'nincs megadva'}`:null,
    grp(p)==='hal'?`- Állomány: ${p.count||'?'} db, ${p.tankL?fmtKg(p.tankL):'?'} literes akvárium`:noWeight(p)?null:`- Súly: ${p.weight?wTxt(p,p.weight):'nincs megadva'}`,
    'Megtörtént mérföldkövek:',...or(done.slice(-15).map(i=>`- ${i.done.date}: ${i.m.t}`)),'Esedékes teendők:',...(due.length?due.slice(0,8):['- nincs']),'Súlymérések:',...or(w),'Parazita elleni kezelések:',...or(pa)]
    .filter(x=>x!==null).map(s=>aiClean(s,200)).filter(Boolean).slice(0,60);
  const notes=[...done.filter(i=>i.done.note).slice(-3).map(i=>`${i.done.date} ${i.m.t}: ${i.done.note}`),
    ...S.events.filter(e=>e.petId===p.id&&e.kind==='own').sort((a,c)=>a.date<c.date?-1:1).slice(-5).map(e=>`${e.date} saját esemény: ${e.title}${e.note?' – '+e.note:''}`),
    ...recs(p,'sym').slice(0,5).reverse().map(e=>`${e.date} tünet: ${e.text} (${SEV[e.sev]||'nincs besorolva'})`),
    ...recs(p,'par').filter(e=>e.product).slice(0,3).map(e=>`${e.date} készítmény: ${e.product}`)].map(noteClean).filter(Boolean).slice(-16);
  const brands=foods(p).length||prodOf(p)?brandList(p).split('; ').map(s=>aiClean(s,60)).filter(Boolean).slice(0,80):[];
  return Object.assign({task,profile,notes,brands,guide:aiGuide(p)},x)}
/* az app forrásokból összeállított útmutatójának lényege (etetés, célértékek, fajlap): a Tanácsadó erre támaszkodik.
   A sorok a klienstől jönnek, ezért a szerveren ezek is átmennek az ellenőrző hívásen. */
function aiGuide(p){
  const out=[],st=stageOf(p),txt=s=>String(s??'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  const add=(pre,s)=>{s=txt(s);if(!s)return;let t=pre+s;while(t.length>400){let i=t.lastIndexOf('. ',398);if(i<100)i=398;out.push(t.slice(0,i+1).trim());t=t.slice(i+1).trim()}out.push(t)};
  const F=FOOD[gkey(p)];
  if(F){(F.base||[]).forEach(x=>add('Étrend: ',x));
    const fq=(F.freq&&st&&F.freq[st])||F.freqAll;if(fq)add(`Etetési gyakoriság${F.freq&&st?` (${stHU(p,st).toLowerCase()} korban)`:''}: `,fq);
    if(F.bad&&F.bad.length)add('Tilos vagy kerülendő ételek: ',F.bad.join('; '));
    if(F.extra)add('Jó tudni az etetésről: ',F.extra)}
  const T=TERRA[gkey(p)];
  if(T){const g=['hot','cool','water','hum'].filter(f=>T[f]).map(f=>`${tLabel(p,f).toLowerCase()} ${tGoal(T[f])} ${TF[f][1]}`);
    const n=[T.night&&`levegő ${tGoal(T.night)} °C`,T.nwater&&`víz ${tGoal(T.nwater)} °C`,T.nhum&&`páratartalom ${tGoal(T.nhum)} %`].filter(Boolean);
    if(g.length)add(`${grp(p)==='hal'||kitOf(p)==='vizi'?'Akvárium':'Terrárium'} célértékei nappal: `,g.join('; ')+(n.length?`; éjjel: ${n.join('; ')}`:'')+'.');
    if(T.note&&!/útmutató/.test(T.note))add('Megjegyzés a célértékekhez: ',T.note)}
  /* a Tartás fül összes kártyája az aktuális életszakaszra (kézbevétel, társak, vedlés, telelés…) */
  const C=CARE[gkey(p)];if(C&&C.g)(C.g.all||C.g[st]||[]).forEach(c=>add('Tartás – '+c[0]+': ',c[1]));
  /* a tartási útmutatóból a környezet kártyái (a Terrárium/Otthon fülről) */
  (HOME[gkey(p)]||[]).filter(c=>/^(Terrárium|Akvárium|Tartály|Hőmérséklet|Vízhőmérséklet|Páratartalom|Páratartalom és permetezés|Víz|Vízminőség|Aljzat)$/.test(c[0])).forEach(c=>add(c[0]+': ',c[1]));
  const fx=fishOf(p);
  if(fx)[['Halfaj',fx.n],['Kifejlett méret',fx.cm],['Akvárium',fx.tank],['Viselkedés és társak',fx.soc],['Eleség',fx.feed],['Jó tudni',fx.note],['Általános',fx.gen]].forEach(([k,v])=>v&&add(k+': ',v));
  if(grp(p)==='hal'){const G=wGoals(p),l=Object.keys(G).filter(k=>WF[k]).map(k=>`${WF[k][2]} ${wGoal(k,G[k])}${WF[k][1]?' '+WF[k][1]:''}`);if(l.length)add('Vízértékek célja: ',l.join('; ')+'.')}
  return out.map(s=>aiClean(s,400)).filter(Boolean).slice(0,40)}
/* ---------- hívás a szerveroldali függvényen át ----------
   A kérés a belépett felhasználó nevében megy; a rendszerprompt és az AI-kulcs a szerveren van.
   Válasz: {"t":"szöveg","cut":false,"sig":"…","qsig":"…"}; az aláírás nélküli előzményt a szerver figyelmen kívül hagyja. */
const AI_URL=SB_URL.replace(/\/$/,'')+'/functions/v1/advisor';
const aiGate=()=>CFG_OK&&!cloud.uid&&cloud.state!=='pending';
async function aiCall(body,{signal}={}){
  if(!CFG_OK||!cloud.sb)throw{code:cloud.state==='pending'?'def':'none'};
  if(!cloud.uid)throw{code:'login'};
  if(navigator.onLine===false)throw{code:'offline'};
  const lim=aiLimit();if(lim)throw lim;
  let tok='';try{const r=await cloud.sb.auth.getSession();tok=(r.data&&r.data.session&&r.data.session.access_token)||''}catch(e){}
  if(!tok)throw{code:'session_expired'};
  aiMark();
  let res;try{res=await fetch(AI_URL,{method:'POST',signal,headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+tok},body:JSON.stringify(body)})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'offline'}}
  let j={};try{j=await res.json()}catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'}}
  if(!res.ok||!j||typeof j.t!=='string'){j=j||{};
    if(j.code==='blocked'){aiRate.until=+new Date(j.until)||Date.now()+3e5;aiRateSave()}
    throw{code:typeof j.code==='string'&&ERR[j.code]?j.code:res.status===401?'session_expired':'def',detail:typeof j.detail==='string'?j.detail:String(res.status),until:j.until}}
  return{text:j.t,truncated:!!j.cut,sig:typeof j.sig==='string'?j.sig:'',qsig:typeof j.qsig==='string'?j.qsig:''}}
/* hozzájárulás: az első AI-kérés előtt egyszer (a chatben a beszélgetés tetején, máshol felugró lapon) */
let aiPending=null;
/* hozzájárulás a Tanácsadóhoz (2. változat, 2026. október: korhatár és tájékoztató; a korábbi elfogadás nem elég) */
const aiAgreed=()=>(S.settings.aiConsentV|0)>=2&&!!S.settings.aiConsent;
const consentText=p=>`<p>A Tanácsadó mesterséges intelligenciával (az OpenAI szolgáltatásával) válaszol. Ehhez a kérdésed, az előző néhány üzenet és ${esc(petName(p))} adatai (név, faj, fajta, kor, ivar, súly, a rögzített mérföldkövek, kezelések és naplóbejegyzések rövidített szövege) a Petavira szerverén át az OpenAI-hoz kerülnek. Az OpenAI ezeket nem használja modelltanításra, és legfeljebb 30 napig őrzi meg.</p><p>Ne írj a kérdésbe vagy a naplóba személyes adatot (például nevet, címet, telefonszámot). A hozzájárulást a Beállítások → Adatkezelési tájékoztató oldalon bármikor visszavonhatod.</p>${agreeHtml('','privFromAi','aiAge')}<p class="err aiAgeErr" role="alert" hidden>Jelöld be a négyzetet a folytatáshoz.</p><p class="sub">A válaszok tájékoztató jellegűek. ${DISC}</p>`;
const consentCard=p=>`<div class="card" id="aiConsent" style="margin-bottom:12px"><b>Mielőtt kérdezel</b>${consentText(p)}<button class="btn" data-act="aiOk">Elfogadom</button></div>`;
function aiConsent(fn){if(aiAgreed()){fn();return}aiPending=fn;openSheet(`<h2>Mielőtt kérdezel</h2>${consentText(pet())}<button class="btn" data-act="aiOk">Elfogadom</button><button class="btn ghost" data-act="close">Mégse</button>`)}
async function sendChat(raw){
  const p=pet();if(!p||chatBusy)return;const text=aiClean(raw,AI_Q);if(!text)return;
  if(!aiAgreed()){chatNote=ERR.consent;redrawChat();return}
  const log=S.chat[p.id]=S.chat[p.id]||[],lastU=[...log].reverse().find(m=>m.r==='u');
  if(lastU&&lastU.sig&&lastU.t===text){chatNote=ERR.dup;redrawChat();return}
  const lim=aiLimit();if(lim){chatNote=aiErrText(lim);redrawChat();return}
  const hist=log.slice(-AI_HIST).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t,...(m.sig?{sig:m.sig}:{})})),u={r:'u',t:text,ts:Date.now()};log.push(u);
  chatBusy=p.id;chatNote='';streamText='';save('chat');redrawChat(true);
  try{
    chatCtl=new AbortController();
    const res=await aiCall(aiPayload(p,'chat',{topic:chatSheet&&TOPIC[chatTopic]?chatTopic:'',messages:[...hist,{role:'user',content:text}]}),{signal:chatCtl.signal});
    if(res.qsig)u.sig=res.qsig;
    log.push({r:'a',t:res.text,ts:Date.now(),...(res.sig?{sig:res.sig}:{}),...(res.truncated?{cut:1}:{})});
  }catch(e){
    if(!e||e.code!=='cancelled')chatNote=aiErrText(e);
  }
  chatBusy=null;chatCtl=null;streamText='';if(log.length>60)log.splice(0,log.length-60);save('chat');redrawChat();
}

document.addEventListener('click',e=>{

  if(t.id==='photoIn')pickPhoto(t);

Object.assign(ACT,{
  auOpen(el){chatSheet=false;authSheet(el.dataset.m)},
  auMode(el){authSheet(el.dataset.m,$('#auMail')?$('#auMail').value.trim():'')},
  async auGo(){
    if(auBusy||!cloud.sb)return;const m=auMode,mail=$('#auMail').value.trim().toLowerCase(),pw=$('#auPw')?$('#auPw').value:'';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return showErr('#auErr','Írd be az e-mail-címed.');
    if(m!=='reset'&&!pw)return showErr('#auErr','Írd be a jelszavad.');
    if(m==='up'&&!pwOk(pw))return showErr('#auErr',PW_MSG);
    if(m==='up'&&!($('#auAgree')&&$('#auAgree').checked))return showErr('#auErr','A regisztrációhoz jelöld be, hogy elolvastad a tájékoztatót, és elmúltál 16 éves (vagy a szülőd hozzájárult).');
    auBusy=true;$('#auErr').hidden=true;const b=$('#auBtn');b.disabled=true;b.textContent='Egy pillanat…';
    const ct=await capToken(),cap=ct?{captchaToken:ct}:{};
    let r;try{r=m==='in'?await cloud.sb.auth.signInWithPassword({email:mail,password:pw,...(ct?{options:cap}:{})})
      :m==='up'?await cloud.sb.auth.signUp({email:mail,password:pw,options:{emailRedirectTo:APP_URL,...cap}})
      :await cloud.sb.auth.resetPasswordForEmail(mail,{redirectTo:APP_URL,...cap})}catch(e){r={error:e}}
    auBusy=false;capReset();
    if(r.error){const x=$('#auBtn');if(x&&auMode===m){x.disabled=false;x.textContent=AU[m].b;showErr('#auErr',auErr(r.error))}return}
    if(m==='in'||(r.data&&r.data.session)){closeSheet();toast(m==='in'?'Beléptél':'Fiók létrehozva, beléptél');return}
    openSheet(m==='up'?`<h2>Nézd meg a postafiókod</h2><p>Megerősítő levelet küldtünk ide: <b>${esc(mail)}</b>. Kattints a benne lévő linkre, utána itt lépj be.</p><p class="sub">Ha pár percen belül nem érkezik meg, nézd meg a levélszemét mappát. Ha ezzel a címmel már volt fiókod, nem kapsz új levelet: lépj be, vagy kérj új jelszót.</p><button class="btn" data-act="auOpen" data-m="in">Belépés</button><button class="btn ghost" data-act="close">Bezárás</button>`
      :`<h2>Nézd meg a postafiókod</h2><p>Ha van fiók ezzel a címmel (<b>${esc(mail)}</b>), küldtünk egy levelet. A benne lévő linkre kattintva adhatsz meg új jelszót.</p><button class="btn ghost" data-act="close">Bezárás</button>`)},
  async pwSave(){
    const pw=$('#npPw').value;if(!pwOk(pw))return showErr('#npErr',PW_MSG);
    const b=$('#npBtn');b.disabled=true;let r;try{r=await cloud.sb.auth.updateUser({password:pw})}catch(e){r={error:e}}
    if(r.error){const x=$('#npBtn');if(x){x.disabled=false;showErr('#npErr',auErr(r.error))}return}
    closeSheet();toast('Jelszó megváltoztatva')},
  async outAsk(){

    if(S.pend&&!cloud.dirty.size)cloud.dirty.add('main').add('chat');await flush();
    confirmSheet('Kilépsz?',`Az adataid a fiókodban megmaradnak, erről az eszközről viszont törlődnek. Belépés után újra megjelennek.${S.pend?' <b>Figyelem:</b> a legutóbbi módosításaidat még nem sikerült feltölteni, kilépéskor elvesznek.':''}`,'Kilépés','out')},

/* ---------- PWA: telepítés és offline működés ---------- */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installHtml(){
  const why='Telepítve saját ikont kap, teljes képernyőn és internet nélkül is elindul.';
  if(standalone())return'<p class="sub">A Petavira telepítve van erre az eszközre.</p>';
  if(installEvt)return`<p class="sub">${why}</p><button class="btn" data-act="install">Telepítés a kezdőképernyőre</button>`;
  return`<p class="sub">${why} ${isIOS?'iPhone-on Safariban koppints a Megosztás gombra, majd válaszd a „Főképernyőhöz adás" pontot.':'A böngésző menüjében válaszd az „Alkalmazás telepítése" vagy a „Hozzáadás a kezdőképernyőhöz" pontot.'}</p>`}
ACT.install=async()=>{if(!installEvt)return;const ev=installEvt;installEvt=null;ev.prompt();try{await ev.userChoice}catch(e){}if(tab==='more')render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='more')render()});
addEventListener('appinstalled',()=>{installEvt=null;toast('Petavira telepítve');if(tab==='more')render()});
