<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetLife</title>
<meta name="description" content="Kisállat életútkövető és tanácsadó: oltások, teendők, táplálkozás és nevelés az állatod korához igazítva.">
<meta name="theme-color" content="#F1F6EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PetLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --bg:#F1F6EF;--card:#FFFFFF;--ink:#14352D;--muted:#586E66;--line:#D9E4DA;--soft:#E3EDE4;
  --brand:#1F7A5A;--brand-ink:#FFFFFF;--ball:#D9F25C;--ball-ink:#28380A;
  --hero:#14352D;--hero-ink:#EEF5EE;--hero-soft:rgba(255,255,255,.18);
  --alert:#B93661;--alert-ink:#FFFFFF;--alert-bg:#FBE8EE;--info:#2B6CA8;--info-bg:#E5EFF9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1D19;--card:#162A25;--ink:#E6F0E9;--muted:#9BB1A8;--line:#284139;--soft:#1E3731;
  --brand:#58C99A;--brand-ink:#0B2019;--hero:#1C3A32;--hero-ink:#EEF5EE;
  --alert:#F28BAB;--alert-ink:#2A0F19;--alert-bg:#3A1C28;--info:#8DBDEB;--info-bg:#1A2E42;
}}
:root[data-theme="dark"]{
  --bg:#0E1D19;--card:#162A25;--ink:#E6F0E9;--muted:#9BB1A8;--line:#284139;--soft:#1E3731;
  --brand:#58C99A;--brand-ink:#0B2019;--hero:#1C3A32;--hero-ink:#EEF5EE;
  --alert:#F28BAB;--alert-ink:#2A0F19;--alert-bg:#3A1C28;--info:#8DBDEB;--info-bg:#1A2E42;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}h2{font-size:19px;font-weight:700;margin:26px 0 10px}
p{margin:0 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.pill{display:flex;align-items:center;gap:8px;min-height:44px;max-width:60%;padding:4px 14px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.pill b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:6px 16px 88px}
#view.chatmode{overflow:hidden;display:flex;flex-direction:column;padding:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin:0 auto;display:flex;height:64px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab i{display:grid;place-items:center;width:48px;height:30px;border-radius:15px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page] i{background:var(--ball);color:var(--ball-ink)}
.ava{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:20px}
.ava.big{width:72px;height:72px;font-size:38px;border:3px solid var(--ball)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--alert);color:var(--alert-ink)}
.btn.small{width:auto;min-height:44px;padding:0 16px;border-radius:12px;flex:none}
.btn.text{width:auto;min-height:44px;padding:0 8px;background:none;color:var(--brand);font-weight:600}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.sub,.hint{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
/* hős kártya az életút-sávval */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px}
.hero .who{display:flex;gap:14px;align-items:center}
.hero h1{font-size:28px}
.hero .meta{opacity:.85;font-size:15px}
.hero .edit{margin-left:auto;align-self:flex-start;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--hero-soft);background:none;color:inherit;font-size:18px}
.trail{margin:22px 0 8px}
.trail-bar{position:relative;display:flex;gap:6px;height:10px}
.seg{flex:1;border-radius:5px;background:var(--hero-soft)}
.seg.past{background:var(--ball)}
.seg.cur{background:linear-gradient(to right,var(--ball) var(--f),var(--hero-soft) var(--f))}
.ballmark{position:absolute;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
.ballmark svg{display:block;width:100%;height:100%}
.trail-lab{display:flex;gap:6px;margin-top:10px;font-size:13px;opacity:.7}
.trail-lab span{flex:1}
.trail-lab .on{opacity:1;font-weight:700;color:var(--ball)}
.hero .next{font-size:14px;margin:12px 0 0;opacity:.9}
.banner{display:flex;gap:12px;align-items:center;background:var(--ball);color:var(--ball-ink);border-radius:18px;padding:14px 16px;margin-bottom:14px;font-weight:600}
.banner .btn{background:var(--ball-ink);color:var(--ball)}
/* teendők */
.tasks{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px}
.tasks li{display:flex;gap:12px;align-items:center;padding:14px 16px}
.tasks li+li{border-top:1px solid var(--line)}
.tasks li>div{flex:1;min-width:0}
.tasks b{display:block}
.when{display:block;font-size:14px;color:var(--muted)}
.late .when{color:var(--alert);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:6px 6px 0 0;background:var(--info-bg);color:var(--info)}
.tag.must{background:var(--alert-bg);color:var(--alert)}
.tips{list-style:none;margin:0;padding:0}
.tips li{position:relative;padding:2px 0 2px 26px;margin-bottom:12px}
.tips li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:12px;border-radius:50%;background:var(--ball);border:2px solid var(--ink)}
.disc{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.note{background:var(--info-bg);color:var(--info);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0}
/* életút */
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 30px;position:relative}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;border-left:2px dashed var(--muted);opacity:.45}
.tl>li{position:relative;margin-bottom:14px}
.tl>li.it::before{content:"";position:absolute;left:-27px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2.5px solid var(--muted)}
.tl>li.done::before{background:var(--brand);border-color:var(--brand)}
.tl>li.now::before{border-color:var(--brand)}
.tl>li.late::before{border-color:var(--alert)}
.tl>li.own::before{background:var(--ink);border-color:var(--ink)}
.tl .card{padding:14px}
.tl .card b{display:block}
.tl .card p{font-size:14px;color:var(--muted);margin:6px 0 0}
.tl .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
.tl .ok{color:var(--brand);font-weight:700;font-size:14px}
.tl>li.stage{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:17px;padding:8px 0 2px}
.tl>li.stage small{display:block;font:500 13px Figtree,system-ui,sans-serif;color:var(--muted)}
.tl>li.stage::before{content:"";position:absolute;left:-25px;top:15px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.tl>li.today{display:flex;align-items:center;gap:10px;font-weight:700}
.tl>li.today .ballmark{position:absolute;left:-19px;top:50%}
.tl>li.today::after{content:"";flex:1;border-top:2px solid var(--ink);opacity:.25}
/* chat */
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px 10px}
#msgs{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.a .bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px}
.msg.e{align-self:center;background:var(--alert-bg);color:var(--alert);border-radius:12px;padding:10px 14px;font-size:14px;max-width:100%}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sugs button{text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--bg)}
.composer textarea{flex:1;resize:none;min-height:48px;max-height:120px;padding:11px 14px;line-height:1.4}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:700}
.note.warn{background:var(--alert-bg);color:var(--alert)}
.seg2{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.seg2::-webkit-scrollbar{display:none}
.seg2 button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.seg2 button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.short{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.num{font:800 30px/1.1 "Bricolage Grotesque",Figtree,system-ui,sans-serif}
.chart{display:block;width:100%;height:auto;margin-top:12px}
.bad{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0}
.bad li{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.plan div{text-align:center;font-size:13px;color:var(--muted)}
.plan i{display:block;height:56px;border-radius:8px;margin-bottom:6px;background:linear-gradient(to top,var(--brand) var(--h),var(--soft) var(--h))}
.plan b{display:block;color:var(--ink);font-size:15px}
a.btn{text-decoration:none}
.btn[aria-disabled=true]{opacity:.5;pointer-events:none}
.back{margin-left:-8px}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 18px;border-radius:26px;border:2px solid #14352D;background:var(--ball);color:var(--ball-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px -6px rgba(8,22,18,.55)}
.sheet.chatsheet{display:flex;flex-direction:column;height:88%;padding:14px 0 0;overflow:hidden}
.chatsheet .composer{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.aitext{white-space:pre-wrap;overflow-wrap:anywhere}
.tag.prem{background:var(--ball);color:var(--ball-ink)}
.guide{margin-bottom:8px}.guide p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:8px}
.acc summary{min-height:52px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
.acc[open] summary::after{content:"–"}
.acc>p,.acc>.aitext{margin:0 0 10px}
.steps2{margin:0 0 10px;padding-left:22px}.steps2 li{margin-bottom:6px}
.acc .ok{color:var(--brand);font-weight:800}
/* űrlapok, lapok */
.f{display:block;margin:14px 0}
.f>span{display:block;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
textarea{padding:12px 14px}
.err{color:var(--alert);font-weight:600;font-size:14px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;min-height:0}
.chips span{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:84px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile em{font-style:normal;font-size:30px;line-height:1.1}
.tile[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.steps i.on{background:var(--brand)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(8,22,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet h2{margin-top:0;font-size:22px}
.sheet .btn+.btn{margin-top:10px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%;text-align:center}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0}
.list li+li{border-top:1px solid var(--line)}
.list .grow{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;min-height:48px}
.empty{text-align:center;padding:36px 8px}
.empty .big{font-size:64px;line-height:1}
.empty h1{margin:14px 0 8px;font-size:30px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D9F25C" stroke="currentColor" stroke-width="2"/><path d="M5 5c4 3 4 11 0 14M19 5c-4 3-4 11 0 14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>PetLife</div>
    <button class="pill" id="petPill" data-act="pets" hidden></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Fő navigáció"><div>
  <button class="tab" data-act="tab" data-tab="home"><i><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></i>Főoldal</button>
  <button class="tab" data-act="tab" data-tab="path"><i><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg></i>Életút</button>
  <button class="tab" data-act="tab" data-tab="health"><i><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></i>Egészség</button>
  <button class="tab" data-act="tab" data-tab="ai"><i><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></i>Tanácsadó</button>
  <button class="tab" data-act="tab" data-tab="more"><i><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></i>Több</button>
</div></nav>
<button class="fab" id="fab" data-act="ask" hidden><span aria-hidden="true">💬</span>Kérdezz</button>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- segédek ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=864e5;
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const D=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function addM(d,n){const w=Math.trunc(n),f=n-w,r=new Date(d.getFullYear(),d.getMonth()+w,1);
  r.setDate(Math.min(d.getDate(),new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));
  if(f)r.setDate(r.getDate()+Math.round(f*30.44));return r}
function monthsBetween(a,b){let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(addM(a,m)>b)m--;
  return{m,days:Math.round((b-addM(a,m))/DAY)}}
const ageMAt=(p,at)=>{const{m,days}=monthsBetween(D(p.birth),at);return m+days/30.44};
const ageM=p=>ageMAt(p,today());
function fmtAge(p){const b=D(p.birth),t=today(),{m}=monthsBetween(b,t),total=Math.round((t-b)/DAY);
  if(total<14)return`${total} napos`;if(m<3)return`${Math.floor(total/7)} hetes`;if(m<12)return`${m} hónapos`;
  const y=Math.floor(m/12),r=m%12;return r?`${y} éves, ${r} hónapos`:`${y} éves`}
const span=d=>d<14?`${d} nap`:d<60?`${Math.round(d/7)} hét`:d<700?`${Math.round(d/30.44)} hónap`:`${Math.round(d/365.25)} év`;
const fmtDate=d=>d.toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'});
const val=(v,p)=>typeof v==='function'?v(p):v;

/* ---------- törzsadatok (tájékoztató jellegű) ---------- */
const SPECIES={kutya:{n:'Kutya',e:'🐶'},macska:{n:'Macska',e:'🐱'},nyul:{n:'Nyúl',e:'🐰'},tengerimalac:{n:'Tengerimalac',e:'🐹'},horcsog:{n:'Hörcsög',e:'🐹'},egyeb:{n:'Egyéb',e:'🐾'}};

    if(hasR&&(anon||foreign||!S.updatedAt||(R.updatedAt||0)>(S.updatedAt||0))){

      const mine=S,keep=anon||mine.pend;

      cloud.dirty.clear();

      if(extra.length){S.pets.push(...extra);S.events.push(...mine.events.filter(e=>!have.has(e.petId)));
        extra.forEach(p=>{if(mine.chat[p.id])S.chat[p.id]=mine.chat[p.id];if(mine.ai[p.id])S.ai[p.id]=mine.ai[p.id];if(p.photo)cloud.dirty.add('photo_'+p.id)});
        S.settings.activePetId=extra[0].id;S.updatedAt=Date.now();S.pend=true;cloud.dirty.add('main').add('chat')}
    }else{
      S.owner=uid;
      if(S.updatedAt&&(S.pend||!hasR||S.updatedAt>(R.updatedAt||0))){S.pend=true;cloud.dirty.add('main').add('chat');S.pets.forEach(p=>p.photo&&cloud.dirty.add('photo_'+p.id))}

}

function buildItems(p){

  S.events.filter(e=>e.petId===p.id&&e.kind==='ms').sort((a,c)=>a.date<c.date?-1:1).forEach(e=>(done[e.key]=done[e.key]||[]).push(e));

    if(m.every){
      (done[m.key]||[]).forEach(e=>items.push({m,done:e,date:D(e.date)}));
      const anchors=[m.key,...(m.anchors||[])].flatMap(k=>done[k]||[]).map(e=>D(e.date)).sort((a,c)=>c-a);
      let due,unknown=false;
      if(anchors.length)due=addM(anchors[0],m.every);

function chatContext(p,task){
  const st=stageOf(p),items=buildItems(p),size=sizeOf(p);
  const hist=[...items.filter(i=>i.done).map(i=>[i.done.date,`${i.m.t} (megtörtént)${i.done.note?' – '+i.done.note:''}`]),
    ...S.events.filter(e=>e.petId===p.id&&e.kind==='own').map(e=>[e.date,`${e.title}${e.note?' – '+e.note:''}`])].sort((a,b)=>a[0]<b[0]?-1:1).slice(-25).map(x=>`- ${x[0]}: ${x[1]}`);
  const due=dueList(p,items).map(i=>`- ${i.m.t}${i.unknown?'':' ('+iso(i.date)+')'}`);
  const or=(a)=>a.length?a:['- nincs bejegyzés'];
  const w=recs(p,'w').slice(0,5).map(e=>`- ${e.date}: ${e.kg} kg`),sy=recs(p,'sym').slice(0,5).map(e=>`- ${e.date}: ${e.text} (${SEV[e.sev]||'nincs besorolva'})`),
    pa=recs(p,'par').slice(0,4).map(e=>`- ${e.date}: ${PAR_SHORT[e.ptype]}${e.product?' – '+e.product:''}`);
  return[SYS,ADD,'',`Mai dátum: ${iso(today())}`,'','Az állat profilja:',`- Név: ${p.name||'nincs megadva'}`,`- Faj: ${speciesLabel(p)}`,`- Fajta: ${breedLabel(p)||'nincs megadva'}`,
    size?`- Méret: ${SIZE_HU[size]}`:null,`- Életkor: ${fmtAge(p)} (születési dátum: ${p.birth}${p.est?', becsült':''})`,`- Életszakasz: ${st?STAGE_HU[st]:'ennél a fajnál nincs meghatározva'}`,
    `- Ivar: ${{him:'hím',nosteny:'nőstény'}[p.sex]||'nincs megadva'}`,`- Ivartalanított: ${p.neutered||'nincs megadva'}`,`- Súly: ${p.weight?p.weight+' kg':'nincs megadva'}`,'',
    'Előzmények az életútból:',...(hist.length?hist:['- nincs rögzített esemény']),'','Esedékes teendők:',...(due.length?due:['- nincs']),'','Súlymérések:',...or(w),'','Tünetnapló:',...or(sy),'','Parazita elleni kezelések:',...or(pa),'',
    `Ha márkát vagy terméket említesz, csak ezek közül válassz: ${brandList(p)}.`,'','Sima szöveggel válaszolj, markdown formázás nélkül.',task||'A felhasználó üzenetei következnek.'].filter(x=>x!==null).join('\n');
}
const getSample=()=>sampleP||(sampleP=(window.claude&&claude.use?claude.use('sample'):Promise.resolve(null)).catch(()=>null));
async function sendChat(text){
  const p=pet();text=(text||'').trim();if(!p||chatBusy||!text)return;
  const log=S.chat[p.id]=S.chat[p.id]||[];log.push({r:'u',t:text.slice(0,2000),ts:Date.now()});
  chatBusy=p.id;chatNote='';streamText='';save('chat');redrawChat(true);
  const tp=chatSheet&&TOPIC[chatTopic]?`A felhasználó most a(z) „${TOPIC_HU[chatTopic]}" képernyőről kérdez: elsősorban erre a témára figyelj (${TOPIC[chatTopic]}). `:'';
  try{
    const sample=await getSample();if(!sample)throw{code:'none'};
    const turns=[{role:'user',content:chatContext(p,tp+'A felhasználó üzenetei következnek.')},...log.slice(-13).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}))];
    chatCtl=new AbortController();
    const res=await sample(turns,{cache:false,signal:chatCtl.signal,onText:({text})=>{streamText=text;const b=$('#pending');if(b){b.textContent=text;scrollChat()}}});
    log.push({r:'a',t:res.text,ts:Date.now(),...(res.truncated?{cut:1}:{})});
  }catch(e){
    if(e&&e.text)log.push({r:'a',t:e.text,ts:Date.now(),cut:1});
    if(!e||e.code!=='cancelled')chatNote=ERR[e&&e.code]||ERR.def;
  }
  chatBusy=null;chatCtl=null;streamText='';if(log.length>60)log.splice(0,log.length-60);save('chat');redrawChat();
}

    closeSheet();toast('Jelszó megváltoztatva')},
  async outAsk(){
    clearTimeout(cloud.timer);for(let i=0;i<40&&cloud.busy;i++)await sleep(100);
    if(S.pend&&!cloud.dirty.size)cloud.dirty.add('main').add('chat');await flush();
    confirmSheet('Kilépsz?',`Az adataid a fiókodban megmaradnak, erről az eszközről viszont törlődnek. Belépés után újra megjelennek.${S.pend?' <b>Figyelem:</b> a legutóbbi módosításaidat még nem sikerült feltölteni, kilépéskor elvesznek.':''}`,'Kilépés','out')},
  async out(){
    if(!cloud.sb||cloud.leaving)return;cloud.leaving=true;let r;try{r=await cloud.sb.auth.signOut({scope:'local'})}catch(e){r={error:e}}
    if(r&&r.error){cloud.leaving=false;closeSheet();toast('A kilépés most nem sikerült. Ellenőrizd az internetkapcsolatot.')}}
});
document.addEventListener('submit',e=>{if(e.target.id==='auForm')e.preventDefault()});
document.addEventListener('visibilitychange',recheck);
addEventListener('online',recheck);

/* ---------- PWA: telepítés és offline működés ---------- */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installHtml(){
  const why='Telepítve saját ikont kap, teljes képernyőn és internet nélkül is elindul.';
  if(standalone())return'<p class="sub">A PetLife telepítve van erre az eszközre.</p>';
  if(installEvt)return`<p class="sub">${why}</p><button class="btn" data-act="install">Telepítés a kezdőképernyőre</button>`;
  return`<p class="sub">${why} ${isIOS?'iPhone-on Safariban koppints a Megosztás gombra, majd válaszd a „Főképernyőhöz adás" pontot.':'A böngésző menüjében válaszd az „Alkalmazás telepítése" vagy a „Hozzáadás a kezdőképernyőhöz" pontot.'}</p>`}
ACT.install=async()=>{if(!installEvt)return;const ev=installEvt;installEvt=null;ev.prompt();try{await ev.userChoice}catch(e){}if(tab==='more')render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='more')render()});
addEventListener('appinstalled',()=>{installEvt=null;toast('PetLife telepítve');if(tab==='more')render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
if('serviceWorker'in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(standalone()&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})});

applyTheme();render();initCloud();
</script>
